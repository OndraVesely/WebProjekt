<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.min.css">
</head>

<body>
  <nav class="navbar navbar-expand-sm bg-dark  navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Sushi UH</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      </button>
      <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="stranka2.html">Objednávka</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="stranka3.html">Kontakt</a>
          </li>
        </ul>
      </div>
      <a class="navbar-brand fw-bold">寿司ウー</a>
    </div>
  </nav>
  <div class="container my-4">
    <div class="card p-3 border-2 border-bg-dark">
      <h2 class="text-dark mb-3"><i class="fa-solid fa-pen-to-square me-2"></i>Objednávka sushi</h2>

      <form action="#" method="POST">
        <div class="mb-3">
          <label for="jmeno" class="form-label fw-bold">Zadejte vaše jméno a příjmení:</label>
          <input type="text" class="form-control" id="jmeno" placeholder="Jméno Příjmení" required>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label fw-bold">Vaše telefonní číslo:</label>
          <input type="tel" class="form-control" id="phone" placeholder="000-000-000" required>
        </div>
        <div class="mb-3">
          <label for="city" class="form-label fw-bold">Vaše město:</label>
          <input type="text" class="form-control" id="city" placeholder="Město" required>
        </div>
        <div class="mb-3">
          <label for="adress" class="form-label fw-bold">Vaše adresa:</label>
          <input type="text" class="form-control" id="adress" placeholder="Adresa" required>
        </div>

        <div class="mb-3">
          <label for="výběrSushi" class="form-label fw-bold mb-3">Vyberte své sushi:</label>
          <select id="výběrSushi" name="sushi[]" multiple placeholder="Výběr sushi..." autocomplete="off">
            <option value="maki">Maki - 120 Kč</option>
            <option value="nigiri">Nigiri - 150 Kč</option>
            <option value="sashimi">Sashimi - 180 Kč</option>
            <option value="uramaki">Uramaki - 140 Kč</option>
            <option value="temaki">Temaki - 100 Kč</option>
          </select>
          <div class="form-text text-danger">Musíte vybrat odpověď!!!</div>
        </div>
        <div class="mb-3">
          <label for="výběrPlatby" class="form-label fw-bold mb-3">Vyberte způsob platby:</label>
          <select id="výběrPlatby" name="platba" multiple placeholder="Výběr platby..." autocomplete="off">
            <option value="pokladna">V hotovosti</option>
            <option value="karta">Platební kartou</option>
          </select>
          <div class="form-text text-danger">Musíte vybrat odpověď!!!</div>
        </div>
        </select>
        <p class="fw-bold">Budete-li mít jakýkoiv problém s vaší objednávkou, nebojte se nás kontaktovat.</p>
        <button type="submit" class="btn btn-dark btn-lg">Odeslat objednávku</button>
        
      </form>
    </div>
  </div>

  <footer class="bg-dark text-light text-center py-3 mt-auto">
    <p class="mb-1">Projekt z WEB - 2. ročník</p>
    <a href="dokumentace.pdf" target="_blank" class="text-warning text-decoration-none fw-bold">
      <i class="fa-solid fa-file-pdf me-1"></i>Odkaz na dokumentaci
    </a>
  </footer>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="node_modules/tom-select/dist/js/tom-select.complete.js"></script>
  <script>
    new TomSelect("#výběrSushi", {
      maxItems: 5,
      plugins: ['remove_button']
    });
  </script>
  <script>
    new TomSelect("#výběrPlatby", {
      maxItems: 1
    });
  </script>

</body>

</html>
