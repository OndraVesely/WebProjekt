<!DOCTYPE html>
<html lang="cs">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Můj IT Web - Kontakt</title>
  <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.css">
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    .ck-editor__editable_inline {
      min-height: 150px;
    }
  </style>
</head>
 
<body class="bg-info-subtle">
 
  <nav class="navbar navbar-expand-sm bg-dark  navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="stranka2.html">
        <i class="fa-solid fa-laptop-code me-2"></i>Můj IT Projekt
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigace">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navigace">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Domů</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="stranka2.html">Registrační formulář</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-bold text-decoration-underline" href="stranka3.html">Kontakt</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
 
  <div class="container my-4">
    <div class="card p-3 border-2 border-primary">
      <h2 class="text-primary mb-3"><i class="fa-solid fa-envelope me-2"></i>Napište mi zprávu</h2>
 
      <form action="#" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label fw-bold">email:</label>
          <input type="email" class="form-control" id="email" placeholder="vas-email@seznam.cz" required>
        </div>
        <div class="mb-3">
          <label for="textZpravy" class="form-label fw-bold">Text zprávy:</label>
          <textarea id="textZpravy" name="zprava" class="form-control"></textarea>
        </div>
 
        <button type="submit" class="btn btn-primary btn-lg">Odeslat dotaz</button>
      </form>
    </div>
  </div>
 
  <footer class="bg-dark text-light text-center py-3 mt-auto">
    <p class="mb-1">Školní projekt z IT - 2. ročník</p>
    <a href="dokumentace.pdf" target="_blank" class="text-warning text-decoration-none fw-bold">
      <i class="fa-solid fa-file-pdf me-1"></i>Odkaz na dokumentaci v PDF zde
    </a>
  </footer>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.ckeditor.com/ckeditor5/41.2.0/classic/ckeditor.js"></script>
  <script>
    ClassicEditor
      .create(document.querySelector('#textZpravy'))
      .catch(error => {
        console.error(error);
      });
  </script>
</body>
 
</html>
